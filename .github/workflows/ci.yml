name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Full qualification or a production GPU diagnostic
        type: choice
        default: all
        options: [all, production, production-skip-loss, cpu-recovery]
permissions:
  contents: read
concurrency:
  group: tetra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npx --yes eslint@10.1.0 .
      - run: npm test
      - run: npm run build
  browser:
    needs: unit
    env:
      TETRA_SUITE: ${{ matrix.suite }}
    # The largest native Ultra scenes also exercise latency bounds. Use the
    # desktop macOS renderer for those; keep Linux pixel/recovery suites below.
    runs-on: ${{ (matrix.suite == 'explorer' || matrix.suite == 'reuse' || matrix.suite == 'production' || startsWith(matrix.suite, 'maximum') || matrix.suite == 'cpu-recovery') && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'cpu-recovery' && '["cpu-recovery"]' || startsWith(inputs.suite, 'production') && '["production"]' || '["review","release","deep","quality","explorer","perf","reuse","interactions","production","zoom","webkit","reuse-webkit","interactions-webkit","production-webkit","zoom-webkit","maximum","maximum-webkit"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run build
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts axe-core@4.11.0
          python3 -m venv .browser-venv
          echo "$GITHUB_WORKSPACE/.browser-venv/bin" >> "$GITHUB_PATH"
          .browser-venv/bin/python -m pip install -r tests/requirements.txt
          if [[ "$TETRA_SUITE" == *webkit ]]; then .browser-venv/bin/python -m playwright install --with-deps webkit; else .browser-venv/bin/python -m playwright install --with-deps chromium; fi
      - name: Browser suite on a served origin
        run: |
          node serve.cjs dist >/tmp/tetra-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for ((attempt = 0; attempt < 30; attempt++)); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          SUITE="$TETRA_SUITE"
          if [[ "$SUITE" == *-webkit ]]; then export TETRA_BROWSER=webkit; SUITE="${SUITE%-webkit}"; fi
          if [[ "$SUITE" == cpu-recovery ]]; then python3 tools/perf/cpu_recovery.py; else python3 "tests/browser_${SUITE}.py"; fi
        env:
          TETRA_BASE_URL: http://127.0.0.1:4173
          TETRA_HARDWARE_BROWSER: ${{ runner.os == 'macOS' && '1' || '0' }}
          TETRA_TRACE_GPU: ${{ startsWith(inputs.suite, 'production') && '1' || '0' }}
          TETRA_SKIP_PENDING_LOSS: ${{ inputs.suite == 'production-skip-loss' && '1' || '0' }}
          DEBUG: ${{ startsWith(inputs.suite, 'production') && 'pw:browser' || '' }}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: tests/review-output/
          retention-days: 14
          if-no-files-found: warn
