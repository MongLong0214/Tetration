name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release version and main ancestry
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          EXPECTED="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$EXPECTED"
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Publish the offline application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="tetra-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../$ARCHIVE" .)
          shasum -a 256 "$ARCHIVE" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" SHA256SUMS --verify-tag --generate-notes --title "TETRA $GITHUB_REF_NAME"
